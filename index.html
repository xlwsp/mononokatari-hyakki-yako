<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>モノノカタリ -百鬼夜行-</title>
  <meta name="theme-color" content="#3f6b37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #3f6b37; overflow: hidden; touch-action: none; overscroll-behavior: none; }
    #game { width: 100%; height: 100%; }
    canvas { display: block; }
    /* スマホを横にしたときは「縦にしてね」 */
    #rotate { display: none; position: fixed; inset: 0; z-index: 99; background: #3f6b37; color: #fff8ea;
      font-family: "M PLUS Rounded 1c", sans-serif; font-weight: 800; font-size: 22px; text-align: center;
      align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-shadow: 0 3px 0 #4a3a2e; }
    #rotate .phone { font-size: 56px; animation: tilt 1.6s ease-in-out infinite; }
    @keyframes tilt { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
    @media (orientation: landscape) and (pointer: coarse) and (max-height: 520px) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><div class="phone">📱</div><div>スマホを縦にして遊んでね</div></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/net.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/scenes/menu.js"></script>
  <script src="js/scenes/game.js"></script>
  <script src="js/scenes/hud.js"></script>
  <script>window.GV = "__VERSION__";</script>
  <script src="js/main.js"></script>
</body>
</html>
