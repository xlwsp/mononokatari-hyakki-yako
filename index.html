<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>モノノカタリ -百鬼夜行-</title>
  <meta name="theme-color" content="#141022">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800;900&family=Yuji+Syuku&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #141022; overflow: hidden; touch-action: none; overscroll-behavior: none; }
    #game { width: 100%; height: 100%; }
    canvas { display: block; }
    /* スマホはいつも横画面（縦に持っているときは画面ごと90度まわす。js/ui-kit.js の applyViewport） */
    #vp { position: fixed; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="vp"><div id="game"></div></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    // ゲームのファイルを読み込む。更新のたびに古いファイルが残らないよう、版番号を付けて読む
    window.GV = "__VERSION__";
    (function () {
      var files = ['js/sim.js', 'js/net.js', 'js/sfx.js', 'js/bgm.js', 'js/textures.js', 'js/ui-kit.js', 'js/fx.js',
        'js/scenes/shop.js', 'js/scenes/extra.js', 'js/scenes/records.js', 'js/scenes/menu.js', 'js/scenes/game.js', 'js/scenes/hud.js', 'js/main.js'];
      function load(v) {
        if (v) window.GV = String(v);
        files.forEach(function (f) {
          var s = document.createElement('script');
          s.src = f + (v ? '?v=' + encodeURIComponent(v) : '');
          s.async = false; // 書いた順に実行
          document.body.appendChild(s);
        });
      }
      if (window.GV !== '__VERS' + 'ION__') { load(window.GV); return; } // サーバーから配信（版番号入り）
      // GitHub Pages：version.json の版番号を見る
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) { load(j.v); })
        .catch(function () { load(String(Date.now())); });
    })();
  </script>
</body>
</html>
